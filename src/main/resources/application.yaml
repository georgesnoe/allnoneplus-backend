spring:
  application:
    name: AllnOne+
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: true

app:
  planning:
    # Base URL of the planning API
    base-url: ${PLANNING_BASE_URL}
    # Session cookie sent with each request
    cookie: ${PLANNING_COOKIE}