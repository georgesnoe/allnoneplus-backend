server:
  port: ${PORT:8080}

spring:
  application:
    name: ${APP_NAME:AllnOne+}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc:
          timezone: ${JPA_HIBERNATE_JDBC_TIMEZONE:UTC}
        format_sql: ${JPA_HIBERNATE_FORMAT_SQL:false}

  flyway:
    enabled: true
    validate-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          azure:
            provider: ${OAUTH_PROVIDER:azure}
            client-id: ${OAUTH_CLIENT_ID}
            client-secret: ${OAUTH_CLIENT_SECRET}
            scope: ${OAUTH_SCOPES:openid,profile,email,offline_access}
            authorization-grant-type: ${OAUTH_GRANT_TYPE:authorization_code}
            redirect-uri: ${OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            client-name: ${OAUTH_CLIENT_NAME:Microsoft}
        provider:
          azure:
            authorization-uri: ${OAUTH_AUTHORIZATION_URI:https://login.microsoftonline.com/${OAUTH_TENANT_ID:common}/oauth2/v2.0/authorize}
            token-uri: ${OAUTH_TOKEN_URI:https://login.microsoftonline.com/${OAUTH_TENANT_ID:common}/oauth2/v2.0/token}
            jwk-set-uri: ${OAUTH_JWK_SET_URI:https://login.microsoftonline.com/${OAUTH_TENANT_ID:common}/discovery/v2.0/keys}
            user-info-uri: ${OAUTH_USER_INFO_URI:https://graph.microsoft.com/oidc/userinfo}
            user-name-attribute: ${OAUTH_USER_NAME_ATTRIBUTE:sub}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSE:health,info,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

vaadin:
  launch-browser: ${VAADIN_LAUNCH_BROWSER:false}
